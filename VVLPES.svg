<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300">

    <defs>
<linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%">
        <animate
            attributeName="stop-color"
            values="#00ff44;#00ffff;#00ff44"
            keyTimes="0;0.5;1"
            dur="6s"
            repeatCount="indefinite" />
    </stop>

    <stop offset="100%">
        <animate
            attributeName="stop-color"
            values="#00ffff;#00ff44;#00ffff"
            keyTimes="0;0.5;1"
            dur="6s"
            repeatCount="indefinite" />
    </stop>
</linearGradient>


        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />

            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
<!-- CRT scanlines -->
<pattern id="scanlines" width="1000" height="6" patternUnits="userSpaceOnUse">
    <rect width="1000" height="3" fill="#000" opacity="0.18"/>
</pattern>

<!-- Background CRT noise / vignette -->
<radialGradient id="crt-bg">
    <stop offset="0%" stop-color="#06251b" stop-opacity="0.35"/>
    <stop offset="70%" stop-color="#00110c" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
</radialGradient>

<!-- RGB separation -->
<filter id="rgb-glitch">
    <feOffset in="SourceGraphic" dx="-3" dy="0" result="red"/>
    <feOffset in="SourceGraphic" dx="3" dy="0" result="cyan"/>

    <feFlood flood-color="#ff003c" result="redColor"/>
    <feFlood flood-color="#00ffff" result="cyanColor"/>

    <feComposite in="redColor" in2="red" operator="in" result="redLayer"/>
    <feComposite in="cyanColor" in2="cyan" operator="in" result="cyanLayer"/>

    <feBlend in="redLayer" in2="cyanLayer" mode="screen" result="rgb"/>
    <feBlend in="rgb" in2="SourceGraphic" mode="screen"/>
</filter>
    </defs>
<rect width="100%" height="100%" fill="#15241f"/>
<rect width="100%" height="100%" fill="url(#scanlines)"/>
    <g
        class="glitch"
        font-family="monospace"
        font-size="18"
        font-weight="bold"
        fill="url(#rainbow)"
        filter="url(#rgb-glitch)"
