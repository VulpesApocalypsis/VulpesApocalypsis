@keyframes glitch {
    0%, 86%, 100% {
        transform: translate(0, 0);
    }

    87% {
        transform: translate(-7px, 0);
    }

    88% {
        transform: translate(8px, 0);
    }

    89% {
        transform: translate(-3px, 2px);
    }

    90% {
